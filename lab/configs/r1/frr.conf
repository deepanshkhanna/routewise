! R1 — RouteWise triangular OSPF + RIP v2 lab
frr version 10.7.1
frr defaults traditional
hostname r1
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 192.168.1.1/32
 ip ospf area 0
exit
!
! Link to R2 — 10.0.12.0/30
interface eth1
 ip address 10.0.12.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
! Link to R3 — 10.0.13.0/30
interface eth2
 ip address 10.0.13.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 1.1.1.1
 network 192.168.1.1/32 area 0
 network 10.0.12.0/30 area 0
 network 10.0.13.0/30 area 0
exit
!
router rip
 version 2
 network 10.0.12.0/30
 network 10.0.13.0/30
 network 192.168.1.1/32
 no ip split-horizon
exit
!
line vty
exit
!
