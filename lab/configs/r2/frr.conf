! R2 — RouteWise triangular OSPF + RIP v2 lab
frr version 10.7.1
frr defaults traditional
hostname r2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 192.168.2.2/32
 ip ospf area 0
exit
!
! Link to R1 — 10.0.12.0/30
interface eth1
 ip address 10.0.12.2/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
! Link to R3 — 10.0.23.0/30
interface eth2
 ip address 10.0.23.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 2.2.2.2
 network 192.168.2.2/32 area 0
 network 10.0.12.0/30 area 0
 network 10.0.23.0/30 area 0
exit
!
router rip
 version 2
 network 10.0.12.0/30
 network 10.0.23.0/30
 network 192.168.2.2/32
 no ip split-horizon
exit
!
line vty
exit
!
